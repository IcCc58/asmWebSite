<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Yenişehir Aile Sağlığı Merkezi bina görseli">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDEBF2"/>
      <stop offset=".55" stop-color="#E9F6F8"/>
      <stop offset="1" stop-color="#F5FBFA"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
